services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: betewubet_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      DATABASE_URL: postgres://erp:erp@db:5432/betewubet_erp
      ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
